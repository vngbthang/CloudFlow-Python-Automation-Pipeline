name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile \
            src/processor.py \
            src/report.py \
            src/run_pipeline.py \
            src/worker.py \
            src/upload_file.py \
            src/create_resources.py \
            src/database.py \
            src/utils.py \
            src/logger.py

      - name: Run tests
        run: python -m pytest

      - name: Run ruff
        run: python -m ruff check src tests

      - name: Run black check
        run: python -m black --check src tests
